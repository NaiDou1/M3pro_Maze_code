[develop]
script_dir=$base/lib/maze_explorer
[install]
install_scripts=$base/lib/maze_explorer

# docstring 风格检查。convention 取 pep257；D400 与 D415 要求首行以 ASCII 句点
# 结尾，中文句号不被识别，故忽略这两条。用法：python3 -m pydocstyle maze_explorer test
[pydocstyle]
convention = pep257
add-ignore = D400, D415
match = .*\.py
match-dir = maze_explorer, test
