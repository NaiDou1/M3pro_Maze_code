# 场地几何、运动限幅与激光判定参数
#
# 所有数值集中于此，代码中禁止硬编码。现场可根据实测微调后重启节点生效。
/**:
  ros__parameters:
    # ---------------- 场地几何 ----------------
    grid_size: 7              # 7 x 7 格
    cell_size: 0.40           # 格心间距，单位 m，与通道宽一致
    channel_width: 0.40       # 通道宽度，单位 m
    robot_width: 0.215        # 车宽，单位 m，附加装置不得超此宽度
    robot_length: 0.275       # 车长，单位 m
    wall_height: 0.55         # 挡板高度，单位 m，含机械臂总高不得超过
    #: 通道内单侧余量等于格宽减车宽再取半，约 9.25 cm，循迹精度须优于该值的一半
    lateral_margin: 0.0925

    # ---------------- 运动限幅 ----------------
    max_linear_x: 0.25        # 前进与后退上限，单位 m/s
    max_linear_y: 0.20        # 横移上限，单位 m/s，麦轮打滑使横移误差偏大
    max_angular_z: 0.60       # 自转上限，单位 rad/s
    cruise_linear: 0.15       # 直线巡航速度，单位 m/s
    turn_angular: 0.50        # 原地 90 度旋转角速度，单位 rad/s

    # ---------------- 循迹 ----------------
    #: 巡线 PID 三元组依次为 Kp、Ki、Kd。误差是**归一化**横向偏差，无量纲，
    #: 1.0 即线在图像边缘；输出为 angular.z，单位 rad/s。
    #: 注意：不要填像素量纲的增益，旧值 50、0、10 配像素误差会让
    #: 偏差绝对值大于 0.012 px 就饱和到 ±0.6 rad/s，等价满舵开关，车只会画龙。
    line_pid: [1.2, 0.0, 0.2]
    #: 巡线转向符号：-1 = 图像右侧偏差对应右转。本机实测依据：黑线在图像里近粗远细，
    #: 即行 280 宽 12 px 而行 460 宽 17 px，图像下半部为近处且未旋转，线在右侧须右转。
    #: 若日后把相机装反或开启 flip_color，改成 +1。
    line_steer_sign: -1.0
    #: 只对图像下半部分做黑线二值化，降低计算量
    line_roi_top_ratio: 0.5
    #: 判定"线丢失"所需的连续空帧数，超过则触发丢线保护
    line_lost_frames: 5

    # ---------------- 激光判定 ----------------
    front_angle_deg: 0.0      # 正前方扇区中心
    left_angle_deg: 90.0      # 左侧扇区中心
    right_angle_deg: -90.0    # 右侧扇区中心
    rear_angle_deg: 180.0     # 正后方扇区中心
    #: 判定开口时使用的扇区半宽，单位度
    opening_half_width_deg: 20.0
    #: 扇区内最近距离大于该值即认定为开口，单位米
    opening_min_range: 0.55
    #: 碰撞保护阈值：任意方向低于该距离立即停车，单位米
    safety_range: 0.25

    # ---------------- 格心对齐与里程计 ----------------
    #: 到达格心的位置容差，单位 m
    cell_advance_tolerance: 0.03
    #: 朝向容差，单位 rad，约 5 度
    yaw_tolerance: 0.0873
    #: 航向来源：odom_raw 即 STM32 直出，与位置同源、高频；或 odom 即 EKF 输出，
    #: 融合 IMU 航向通常更准，但仅约 6Hz。
    #: 换源后必须重新标定 odom_angular_scale_correction，两者误差特性不同。
    yaw_source: odom_raw

    #: 出厂标定系数，见 calibration 包。语义：真实转角 = 系数 × odom 读数。
    #: 注意：0.75 是出厂车在 **EKF 链路即 /odom** 上实测的经验值，而本系统航向
    #:    闭环默认订阅 /odom_raw 即 STM32 直出，误差特性不同，不能直接沿用。
    #:    故默认取 1.0 即不修正，**必须**用 calibration_tool 的 motion 模式
    #:    现场实测后填写，否则每次转向都会系统性偏角。
    odom_angular_scale_correction: 1.0
    odom_linear_scale_correction: 1.0
    #: 单格推进的超时保护，单位 s，超时进入 FAULT
    advance_timeout: 12.0

    # ---------------- 安全保护，详见 SAFETY.md ----------------
    #: 速度指令看门狗阈值，单位 s：非零指令超过该时长未被刷新即由独立线程强制归零。
    #: 本机 /cmd_vel 无超时停车保护，主线程阻塞时最后的速度会被下位机锁存，
    #: 该看门狗是唯一能覆盖此场景的软件手段。取 0 即禁用，不建议。
    cmd_watchdog_timeout: 0.5
    #: 激光保鲜阈值，单位 s：超过即视为失效。失效时 sector_min_range 返回 None，
    #: 而开口判定与碰撞保护都把 None 当"通畅"，故必须靠保鲜度兜底。
    scan_timeout: 0.5
    #: 相机保鲜阈值，单位 s：超过即视为失效并禁止前进。相机同步后约 10Hz，
    #: 2.0s 无新帧已属异常；失效时循迹偏差恒为 0，车会闷头直行。
    vision_timeout: 2.0
    #: 激光失效后的等待上限，单位 s：先给一次恢复机会，仍失效才判定 FAULT。
    sensor_wait_timeout: 3.0
    #: 传感器短暂失效后允许自旋等待恢复的时长，单位 s，仍失效才放弃本次动作。
    #: 必须留宽限：机械臂动作期间 time.sleep 不 spin，缓存会"变旧"；
    #: SensorHub 首帧同步 RGB-D 实测 1.38~1.88s，含 DDS 发现与配对，故取 2.0s。
    #: 依据：任务日志中相机年龄为 inf 时 11 ms 内烧完 3 次机会并进入 FAULT。
    sensor_recover_wait: 2.0
    #: INIT 阶段等相机首帧的上限，单位 s：等不到同步 RGB-D 就没有视觉巡线，直接 FAULT。
    init_sensor_timeout: 15.0
    #: 走格与转向失败后到下次重试的退避时长，单位 s。没有它时 3 次失败实测在 11 ms
    #: 内烧完，任何瞬时异常都会直接判 FAULT。
    retry_pause_sec: 0.5

    # ---------------- 目标触发与对位 ----------------
    #: 仅在方块水平距离小于该值时才转入对位。相机在巡线姿态下可看到 1~2m 外，
    #: 若远处就冲过去会脱离格心、打乱 DFS 拓扑。
    detect_trigger_distance: 0.60
    #: 对位循环步数上限，步长自适应，单步限幅 0.20m
    approach_max_steps: 20
    #: 对位目标水平距离，须落在机械臂抓取包络 0.13~0.25m 内
    approach_target_distance: 0.20
    #: 每色方块数量上限，赛题规定每色 2 个，达到后不再触发该色
    per_color_quota: 2
    #: 抓取成功后的检测抑制时长，单位 s，防止筐内或残余方块被重复触发
    block_suppress_sec: 3.0
