# 机械臂位姿表与抓取包络参数
#
# 关节角单位为**度**，取值 0 到 180，顺序 joint1 到 joint6。
/**:
  ros__parameters:
    # ---------------- 关键位姿 ----------------
    #: 巡线姿态：相机朝前下方，同时覆盖黑线与前方通道内的方块
    #: 初值取自 follow_line.py 的巡线姿态，**必须现场交互式标定**
    line_pose: [90, 90, 12, 20, 90, 0]

    #: 抓取准备位，接近观察位，夹爪张开
    grasp_home: [90, 150, 12, 20, 90, 30]

    #: 放入车载收集筐的位置，收集筐固定在车尾或车顶，现场标定
    place_pose: [180, 90, 12, 20, 90, 30]

    #: 收起位，行驶时收拢，避免超高与超宽
    stow_pose: [90, 150, 12, 20, 90, 0]

    # ---------------- 夹爪 ----------------
    gripper_open_angle: 30      # joint6 张开
    gripper_closed_angle: 120   # joint6 夹紧，现有 demo 用 120 到 140

    # ---------------- 抓取包络，水平距离，单位米 ----------------
    #: 车体对位目标距离
    grasp_distance_target: 0.20
    #: 有效包络下限，小于此值判为无效
    grasp_distance_min: 0.13
    #: 有效包络上限
    grasp_distance_max: 0.25

    # ---------------- 抓取姿态与定位修正 ----------------
    #: 前向补偿，单位 m：IK 目标取在方块前方一点，避免夹爪撞块，沿用 demo 的 3cm
    forward_compensation: 0.03
    #: 抬起动作时的 joint2 角度
    lift_joint2: 120
    #: 夹爪旋转角 joint5 策略：fixed 用固定值；from_yaw 由方块角点朝向推算
    #: 现有 demo 对 joint5 有一组依赖方块朝向的经验修正，需现场按实际夹爪
    #:    装配与方块摆放复核；固定值默认取中位 90
    joint5_mode: fixed
    joint5_fixed: 90
    #: 相机外参未标定时，退化定位所用的方块中心高度，单位 m。
    #: 不能取 0——那是地面，会让 IK 去够地面而抓空或撞地
    block_center_z: 0.03

    # ---------------- 动作时长，开环，写入消息 time 字段 ----------------
    move_time_ms: 2000          # 常规关节运动
    grasp_time_ms: 1200         # 夹爪开合
    #: 每个动作后额外静置时间，单位 s，缓解舵机到位滞后
    settle_sec: 0.3
