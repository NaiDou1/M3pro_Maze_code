# 机械臂位姿表与抓取包络参数
#
# 关节角单位为**度**（0~180），顺序 joint1..joint6。
/**:
  ros__parameters:
    # ---------------- 关键位姿 ----------------
    #: 巡线姿态：相机朝前下方，同时覆盖黑线与前方通道内的方块
    #: 初值取自 follow_line.py 的巡线姿态，**必须现场交互式标定**
    line_pose: [90, 90, 12, 20, 90, 0]

    #: 抓取准备位（接近观察位，夹爪张开）
    grasp_home: [90, 150, 12, 20, 90, 30]

    #: 放入车载收集筐的位置（收集筐固定在车尾/车顶，现场标定）
    place_pose: [180, 90, 12, 20, 90, 30]

    #: 收起位（行驶时收拢，避免超高/超宽）
    stow_pose: [90, 150, 12, 20, 90, 0]

    # ---------------- 夹爪 ----------------
    gripper_open_angle: 30      # joint6 张开
    gripper_closed_angle: 120   # joint6 夹紧（现有 demo 用 120~140）

    # ---------------- 抓取包络（水平距离，米）----------------
    #: 车体对位目标距离
    grasp_distance_target: 0.20
    #: 有效包络下限，小于此值判为无效
    grasp_distance_min: 0.13
    #: 有效包络上限
    grasp_distance_max: 0.25

    # ---------------- 动作时长（开环，写入消息 time 字段）----------------
    move_time_ms: 2000          # 常规关节运动
    grasp_time_ms: 1200         # 夹爪开合
    #: 每个动作后额外静置时间 (s)，缓解舵机到位滞后
    settle_sec: 0.3
